<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Dot Studio · 旧版精细结构编辑</title><meta name="description" content="捏出你的 Dot：实时调整脸型、五官、头发、穿搭与动作，导出角色或复制完整 AI 创作说明。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='11' fill='%233064ed'/%3E%3Crect x='9' y='11' width='5' height='10' rx='2.5' fill='white'/%3E%3Crect x='18' y='11' width='5' height='10' rx='2.5' fill='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css?v=86"><script defer src="./data.js?v=86"></script><script defer src="./renderer.js?v=86"></script><script defer src="./app.js?v=86"></script><script defer src="./legacy-bridge.js?v=86"></script></head>
<body><header class="topbar"><a href="./" class="brand" aria-label="Dot Icon Studio 首页"><span class="brand-dot"></span><strong>dot</strong><span class="brand-slash">/</span><span>旧版精细结构编辑</span></a><div class="header-actions"><a href="./" class="outline" style="padding:9px 12px;text-decoration:none;color:#346af0">返回 Studio</a><button id="undoConfig" class="quiet" aria-label="撤销" title="撤销">↶</button><button id="redoConfig" class="quiet" aria-label="重做" title="重做">↷</button><button id="loadConfig" class="quiet">导入</button><button id="saveConfig" class="outline">保存配置</button><button id="resetConfig" class="icon-button" aria-label="重置为蓝色 Dot" title="重置为蓝色 Dot">↺</button></div><input hidden type="file" id="configFile" accept=".json,application/json"></header>
<main><div class="intro"><div><h1>旧版结构工具。</h1><p>v1–5 配置独立编辑；不会覆盖主工作台的角色。</p></div><span class="live-label"><i></i> 实时预览</span></div><div class="workspace">
<section class="preview-panel" aria-label="实时角色预览"><div class="canvas checker" id="canvas"><div class="canvas-toolbar"><div><strong id="characterTitle">Dot</strong><span id="bodyLabel">团子精灵</span></div><button id="playPause" class="play-button" aria-label="暂停动作">Ⅱ 暂停</button></div><div id="showcase" class="showcase" aria-live="off"></div><div class="canvas-bottom"><span id="actionBadge"></span><div class="finish-controls" id="finishControls" aria-label="预览画法"></div></div></div><div class="interaction-row"><select id="interactionMode" aria-label="网页互动"><option value="off">互动关闭</option><option value="gaze">目光跟随</option><option value="touch">点击 / 轻抚</option></select><span id="interactionStatus" role="status">网页本地互动</span></div><p class="preview-note" id="previewNote">实时 2D 造型预览 · 毛绒、3D 和写实材质在 ChatGPT 中生成</p><div class="prompt-actions preview-actions"><button id="previewCopy" class="primary">复制创作说明</button><button id="previewOpen" class="secondary">打开 ChatGPT ↗</button></div><div class="export-row"><button id="exportSVG" class="outline">导出 SVG</button><button id="exportPNG" class="outline">导出 PNG</button><button id="exportAnimated" class="outline">动态 SVG</button></div><div class="seed-row"><input id="seedInput" aria-label="随机搭配种子" value="dot-01" maxlength="40"><button id="randomConfig" class="quiet">按种子搭配</button><button id="nextSeed" class="quiet" aria-label="换个种子随机搭配">🎲 换一套</button></div><div class="preset-title"><strong>从喜欢的搭配开始</strong><span>点击载入整套</span></div><div id="presetGrid" class="preset-grid"></div><details class="more-presets"><summary>更多 Dot <span>动物 · 人物 · 机器人 · 奇幻</span></summary><div id="allSubjects"></div><div class="preset-title"><strong>原创材质参考</strong><span>点击载入预设，主画布实时组装</span></div><div id="referenceGallery" class="reference-gallery"></div></details></section>
<section class="config-panel" aria-label="捏脸控制"><nav id="sectionTabs" class="section-tabs" aria-label="角色设置"></nav><div id="controls" class="controls"></div><details class="role-details"><summary>角色设定 <span>可选 · 文字指令</span></summary><div id="roleFields"></div></details><div class="editor-bottom"><div class="purpose-row"><strong>用这个角色创作</strong><div id="purposeControls" class="purpose-options"></div></div><p id="purposeHelp" class="helper"></p><div class="prompt-actions"><button id="copyPrompt" class="primary">复制创作说明</button><button id="copyOpen" class="secondary">打开 ChatGPT ↗</button></div><p class="action-note">打开时也会复制 · 粘贴后生成所选画法与材质</p><details class="prompt-details"><summary>查看完整创作说明</summary><pre id="promptPreview" tabindex="0"></pre></details></div></section></div></main>
<footer><span>dot icon studio</span><span>原创角色 · SVG 导出不是已验证 Pet</span></footer><div id="toast" role="status" aria-live="polite" class="toast"></div></body></html>
