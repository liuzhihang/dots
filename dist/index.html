<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fb"><title>Dot Studio · 角色与 Prompt 工作台</title><meta name="description" content="从 Dots、Grok Bot、Muse 与宠物开始，探索毛绒与哑光材质、自然动作与小配饰，带走属于你的角色 Prompt。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='11' fill='%232366E8'/%3E%3Crect x='9' y='11' width='5' height='10' rx='2.5' fill='white'/%3E%3Crect x='18' y='11' width='5' height='10' rx='2.5' fill='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="./studio.css?v=30"><link rel="preload" href="./assets/dots-plush-hero.webp" as="image"><script type="module" src="./studio.js?v=30"></script></head>
<body><a class="skip-link" href="#workspace">跳到角色工作台</a>
<header class="topbar"><a class="brand" href="./" aria-label="Dot Studio 首页"><span class="brand-symbol" aria-hidden="true"><i></i><i></i></span><b>dot<span>studio</span></b></a><nav class="main-nav" aria-label="主导航"><a href="./" aria-current="page">工作台</a><button data-command="guide">风格指南</button><a href="./editor.html">结构草图</a></nav><div class="header-tools"><button class="icon-btn" id="undo" aria-label="撤销" title="撤销"></button><button class="icon-btn" id="redo" aria-label="重做" title="重做"></button><span class="toolbar-divider"></span><button class="button quiet" data-command="import-config"><span data-icon="upload"></span><span>导入配置</span></button><button class="button outlined" data-command="save-config"><span data-icon="save"></span><span>保存配置</span></button></div></header>
<main id="workspace" class="studio-layout">
<aside class="family-rail" aria-labelledby="family-title"><div class="rail-title"><h1 id="family-title">选择你的角色</h1><span class="eyebrow">CHARACTERS</span></div><div id="families" class="family-list"></div><button class="reference-entry" data-command="reference"><span class="upload-icon" data-icon="image"></span><span><b>用我的参考图</b><small>在 ChatGPT 附图生成</small></span><span data-icon="plus"></span></button><div class="rail-bottom"><p>先挑喜欢的角色，<br>再加一点自己的想法。</p><button class="text-button" data-command="guide">了解四种风格 <span data-icon="book"></span></button><span class="original-note">本站原创预设 · 灵感来自各角色体系</span></div></aside>
<section class="creative-area" aria-label="角色展示与动作"><div class="workspace-heading"><div><span class="eyebrow">YOUR LITTLE CHARACTER</span><h2 id="stageName">蓝色贝雷团子</h2></div><div class="heading-tools"><button class="icon-btn" data-command="random" aria-label="随机搭配" title="随机搭配"><span data-icon="shuffle"></span></button><button class="icon-btn" data-command="reset" aria-label="重置当前角色" title="重置当前角色"><span data-icon="reset"></span></button></div></div><div class="catalog-banner" id="catalogBanner"></div><div class="stage-card" id="stageCard"><div class="stage-top"><span class="stage-tag" id="stageTag">Dots / 细密短绒</span><div class="stage-views" aria-label="角色显示方式"><button class="active" data-view="live" aria-pressed="true">实时角色</button><button data-view="reference" aria-pressed="false">美术参考</button></div></div><div id="stageArt" class="stage-art-area"></div><div class="stage-caption"><div><span class="sample-badge live-badge" id="previewBadge">实时 3D</span><span id="sampleCaption"></span></div><div class="preview-actions"><button id="playPreview" class="text-button" data-command="toggle-play" aria-pressed="true">暂停动作</button><button class="icon-btn" data-command="expand" title="放大或导出当前预览" aria-label="放大或导出当前预览"><span data-icon="maximize"></span></button></div></div></div><div class="preview-truth" id="previewTruth" aria-live="polite"></div><div class="actions-heading"><h3>让它做点什么</h3><button class="text-button" data-command="all-actions">更多动作 <span data-icon="grid"></span></button></div><div id="actionStrip" class="action-strip" aria-label="当前角色的动作预览"></div><div class="current-config" id="currentConfig"></div></section>
<aside class="inspector" aria-label="角色定制"><div class="inspector-header"><h2>加一点个性</h2><span id="configCount">按你的喜好来</span></div><nav class="setting-tabs" aria-label="定制选项" role="tablist"><button role="tab" aria-selected="true" aria-controls="settings" id="tab-appearance" data-tab="appearance">外观</button><button role="tab" aria-selected="false" aria-controls="settings" id="tab-face" data-tab="face" tabindex="-1">表情</button><button role="tab" aria-selected="false" aria-controls="settings" id="tab-accessories" data-tab="accessories" tabindex="-1">配饰</button><button role="tab" aria-selected="false" aria-controls="settings" id="tab-scene" data-tab="scene" tabindex="-1">画面</button></nav><div id="settings" class="settings" role="tabpanel" aria-labelledby="tab-appearance"></div><div class="prompt-dock"><div class="prompt-dock-title"><span><span data-icon="sparkles"></span> 角色 Prompt</span><button class="text-button" data-command="prompt">预览全文</button></div><p id="promptSummary"></p><div class="prompt-dock-actions"><button class="button primary" data-command="copy"><span data-icon="copy"></span>复制 Prompt</button><button class="button outlined square" data-command="export-prompt" aria-label="导出 Prompt TXT" title="导出 Prompt TXT"><span data-icon="download"></span></button></div><button class="button outlined chatgpt-open" data-command="copy-open">复制并打开 ChatGPT</button><small>复制完整 Prompt · 图片在 ChatGPT 添加</small></div></aside>
</main><footer class="footer"><span>dot studio <span class="footer-separator">/</span> 角色与 Prompt 工作台</span><span>48 个角色起点 · 实时定制 · 完整 Prompt</span></footer><div class="mobile-tools"><button class="button outlined" data-command="customize">调整角色</button><button class="button primary" data-command="copy">复制 Prompt</button></div><input id="configFile" type="file" accept=".json,application/json" hidden><dialog id="modal" aria-labelledby="modalTitle"><div class="modal-shell"><div class="modal-top"><div><span class="eyebrow" id="modalEyebrow"></span><h2 id="modalTitle"></h2></div><button class="icon-btn" id="closeModal" aria-label="关闭弹窗"><span data-icon="x"></span></button></div><div id="modalBody" class="modal-body"></div></div></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><p>请启用 JavaScript 以使用角色定制与 Prompt 导出。</p></noscript></body></html>
