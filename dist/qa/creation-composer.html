<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QA Fixture · Layered Composer</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#252631;background:#f4f2f8}
    body{max-width:820px;margin:32px auto;padding:0 20px}
    .notice{padding:14px 16px;border:2px solid #d55736;border-radius:12px;background:#fff4ed;color:#732a1b;font-weight:700}
    .fixture{display:grid;grid-template-columns:minmax(240px,360px) 1fr;gap:24px;align-items:start;margin-top:20px}
    .stage,.report{padding:18px;border:1px solid #dedbe6;border-radius:16px;background:white}
    .checker{background-color:#faf9fc;background-image:linear-gradient(45deg,#e5e2eb 25%,transparent 25%),linear-gradient(-45deg,#e5e2eb 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e5e2eb 75%),linear-gradient(-45deg,transparent 75%,#e5e2eb 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
    #composer{width:100%;min-height:280px;display:grid;place-items:center;overflow:hidden;border-radius:10px}
    #composer canvas{max-width:100%;max-height:360px;object-fit:contain}
    .exports{display:grid;gap:12px;margin-top:16px}
    .exports img{display:block;width:100%;max-width:256px;border:1px solid #dedbe6;border-radius:8px}
    button{margin:6px 4px 0 0;padding:9px 12px;border:0;border-radius:9px;background:#282832;color:white;font-weight:650;cursor:pointer}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:#464453}
    @media(max-width:620px){.fixture{grid-template-columns:1fr}body{margin-top:18px}}
  </style>
</head>
<body>
  <h1>分层合成引擎检查</h1>
  <p class="notice">QA FIXTURE ONLY · 不是产品角色、不是基准资产、不是网页美术验收。下面的几何图块只验证 alpha、遮挡、染色和导出路径。</p>
  <div class="fixture">
    <section class="stage">
      <h2>正面分层预览</h2>
      <div id="composer" class="checker" aria-label="测试合成预览"></div>
      <p id="status">等待本地测试图层。</p>
      <button id="transparent-export">导出透明 PNG</button>
      <button id="opaque-export">导出不透明 PNG</button>
      <button id="recipe-replacement">验证配方替换</button>
      <button id="failure">验证失败后不能导出旧帧</button>
    </section>
    <section class="report">
      <h2>实际 PNG 回读</h2>
      <pre id="report">加载测试图层后，这里显示 PNG 尺寸和 alpha / 颜色采样。</pre>
      <div class="exports" id="exports"></div>
    </section>
  </div>
  <script type="module">
    import {LayeredComposer} from '../studio-composer.js?v=63';
    import {createPreset,setCharacterValue} from '../studio-model.js?v=63';

    const base=createPreset('baseline-dots');
    const config=setCharacterValue(setCharacterValue(base,'colors.body','#D946EF'),'background','solid');
    const pack={
      id:'qa-only-dots-layer-pack',family:'dots',kind:'layered-2d',view:'front',status:'candidate',
      revision:1,provenance:{origin:'qa-fixture',detail:'Synthetic test geometry only; not character artwork.'},baseConfig:base,editablePaths:['colors.body','background'],width:128,height:128,
      layers:[
        {id:'qa-headband-behind',src:'/assets/qa/band-rear.png',z:0},
        {id:'qa-body-tint-mask',src:'/assets/qa/body-mask.png',z:1,tintPath:'colors.body'},
        {id:'qa-eyes-earcups-in-front',src:'/assets/qa/face-earcups-front.png',z:2}
      ]
    };
    const host=document.querySelector('#composer'),status=document.querySelector('#status'),report=document.querySelector('#report'),exports=document.querySelector('#exports');
    const composer=new LayeredComposer(host);
    const showStatus=text=>{status.textContent=text;};
    async function sampleBlob(blob,label){
      const url=URL.createObjectURL(blob),image=new Image();image.src=url;await image.decode();
      const canvas=document.createElement('canvas');canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;
      const context=canvas.getContext('2d',{willReadFrequently:true});context.drawImage(image,0,0);
      const sample=(x,y)=>Array.from(context.getImageData(x,y,1,1).data);
      const center=sample(Math.floor(image.naturalWidth/2),Math.floor(image.naturalHeight*.62));
      const p=document.createElement('p');p.textContent=`${label}: ${image.naturalWidth}×${image.naturalHeight}; alpha corner=${sample(0,0)[3]}; center RGBA=${center.join(',')}`;exports.append(p);
      const link=document.createElement('a');link.href=url;link.download=`qa-only-${label}.png`;link.textContent=`下载 ${label} QA PNG`;exports.append(link);
      const preview=document.createElement('img');preview.src=url;preview.alt=`${label} QA fixture PNG`;preview.className='checker';exports.append(preview);
      report.textContent+=`\n${p.textContent}`;
      return {url,width:image.naturalWidth,height:image.naturalHeight,corner:sample(0,0),center};
    }
    await composer.update(pack,config);
    showStatus(`已渲染 QA fixture，状态=${composer.canvas.dataset.previewStatus}，视角=${composer.canvas.dataset.view}。`);
    document.querySelector('#transparent-export').onclick=async()=>{
      try{const result=await sampleBlob(await composer.capture(256,{transparent:true}),'transparent');showStatus(`透明导出完成；角点 alpha=${result.corner[3]}（预期 0）。`);}
      catch(error){showStatus(`透明导出失败：${error.message}`);}
    };
    document.querySelector('#opaque-export').onclick=async()=>{
      try{const result=await sampleBlob(await composer.capture(256,{transparent:false}),'opaque');showStatus(`不透明导出完成；角点 alpha=${result.corner[3]}（预期 255）。`);}
      catch(error){showStatus(`不透明导出失败：${error.message}`);}
    };
    document.querySelector('#recipe-replacement').onclick=async()=>{
      const recipePack={...pack,editablePaths:[...pack.editablePaths,'action'],variants:[
        {id:'all-test-blocks',values:{action:base.action},layerIds:pack.layers.map(layer=>layer.id)},
        {id:'omit-test-body',values:{action:'idle'},layerIds:['qa-headband-behind','qa-eyes-earcups-in-front']}
      ]};
      const alternate=setCharacterValue(setCharacterValue(base,'action','idle'),'background','transparent');
      try{
        await composer.update(recipePack,alternate);
        const result=await sampleBlob(await composer.capture(256,{transparent:true}),'recipe-replacement');
        showStatus(`配方替换完成；旧测试主体已移除，中心 alpha=${result.center[3]}（预期 0）。这只是图层选择检查。`);
      }catch(error){showStatus(`配方替换失败：${error.message}`);}
    };
    document.querySelector('#failure').onclick=async()=>{
      const broken={...pack,layers:[{...pack.layers[1],src:'https://example.invalid/not-a-local-layer.png'}]};
      try{await composer.update(broken,config);showStatus('错误：外部 URL 未被拒绝。');}
      catch(error){showStatus(`失败路径已拒绝：${error.message}`);}
      try{await composer.capture(128);showStatus('错误：失败后仍能导出旧帧。');}
      catch(error){report.textContent+=`\n失败后旧帧已失效：${error.message}`;}
    };
    window.addEventListener('pagehide',()=>composer.dispose(),{once:true});
  </script>
</body>
</html>
