    character in the second gallery row at left. Preserve the dense plush rounded
    cube body, simple paired black eyes, no limbs, no accessories. Dots family art
    direction: short dense tactile plush, one continuous compact body, two simple
    glossy black vertical oval eyes, no arms hands legs feet mouth or robotic face.
    Soft studio lighting, three-quarter near-front view, full silhouette centered
    with clear margins, not cropped, no floor plane or cast ground shadow. Isolate
    only specified character, no page UI, text, captions, other characters, props
