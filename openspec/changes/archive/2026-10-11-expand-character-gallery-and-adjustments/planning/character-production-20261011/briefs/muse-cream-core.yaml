promptText:
  zh-CN: 单个 Muse 角色，柔软连续绒布包覆体、内嵌桃色脸、小眼睛与短圆肢体。保持头身一体和道具真实承托。 经典连续包覆身体与内嵌脸，双臂自然下垂，无持物；奶油白短绒身体，肤色与道具保持原色；内嵌桃色脸、睁开小圆眼与轻柔微笑。完整单体，真正透明背景，无地面背景或额外文字。
  en: One Muse character with a continuous soft plush hooded body, inset peach face,
    small eyes and short rounded limbs. Preserve the unified hood/body and natural
    support of any held prop. a continuous hooded body with an inset face; no handheld
    objects; both short round arms relaxed. One complete standalone character on true
    alpha transparency, no background or text.
