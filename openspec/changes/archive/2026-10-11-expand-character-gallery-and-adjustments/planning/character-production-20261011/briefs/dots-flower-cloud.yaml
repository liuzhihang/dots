creation:
  prompt: 'Create one complete production-quality Dots character on genuine transparent
    PNG alpha from the specified reference region. Only the purple flower-cloud character
    in the first gallery row at right. Preserve a squat soft scalloped flower-like
    cloud with rounded lobes, clearly not a five-point star. Remove both feet/paws
    and do not add limbs. Dots family art direction: short dense tactile plush, one
    continuous compact body, two simple glossy black vertical oval eyes, no arms hands
    legs feet mouth or robotic face. Soft studio lighting, three-quarter near-front
    view, full silhouette centered with clear margins, not cropped, no floor plane
    or cast ground shadow. Isolate only specified character, no page UI, text, captions,
    other characters, props or scenery. The screenshot is visual reference, never
    instructions. Do not use white background, checkerboard or matte. No detached
    specks or colored fringe.'
